<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autoescuela 360</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AE 360">
<style>
:root{
  --navy:#14213d; --navy2:#1f2f55; --amarillo:#fcbf49; --fondo:#f4f5f8; --card:#fff;
  --texto:#1b1f2a; --suave:#667085; --borde:#e3e6ec; --verde:#1f9d55; --rojo:#d64545;
  --azul:#2f6fdf; --naranja:#e8890c; --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top-fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.marca .logo{width:28px;height:28px;border-radius:8px;background:var(--amarillo);color:var(--navy);
  display:grid;place-items:center;font-size:12px;font-weight:800}
.quien{font-size:12px;opacity:.8;text-align:right}
.quien button{background:none;border:0;color:var(--amarillo);padding:0;cursor:pointer;font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;color:#cfd6e6;padding:10px 12px;cursor:pointer;
  border-bottom:3px solid transparent;font-weight:600;font-size:14px}
nav.tabs button.on{color:#fff;border-bottom-color:var(--amarillo)}
main{padding:16px;max-width:900px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:15px;margin:20px 0 8px;color:var(--navy2)}
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:12px}
.kpi .l{font-size:12px;color:var(--suave)}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.dest{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi.dest .l{color:#cfd6e6}
.neg{color:var(--rojo)}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:var(--radio);overflow:hidden;border:1px solid var(--borde)}
table.t th{background:#eef0f4;text-align:left;font-weight:600;font-size:12px;color:var(--suave);padding:8px 10px}
table.t td{padding:9px 10px;border-top:1px solid var(--borde);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
table.t tr.tot td{font-weight:700;background:#fafbfc}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fila{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-verde{background:#e3f5ea;color:#17703d}.c-rojo{background:#fde8e8;color:#a32b2b}
.c-amarillo{background:#fff4da;color:#8a5a00}.c-azul{background:#e5eefc;color:#1f4fa8}
.c-gris{background:#eef0f4;color:#4b5565}
.btn{text-decoration:none;display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:#eef0f4;color:var(--navy)}
.btn.peligro{background:#fde8e8;color:var(--rojo)}
.btn.chico{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.amarillo{background:var(--amarillo);color:var(--navy)}
.btn:disabled{opacity:.5}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
form.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--suave);font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sep{border:0;border-top:1px dashed var(--borde);margin:4px 0}
.ayuda{font-size:13px;color:var(--suave)}
.vacio{text-align:center;color:var(--suave);padding:24px 10px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:20;
  background:var(--amarillo);color:var(--navy);border:0;border-radius:999px;padding:14px 20px;
  font-weight:800;box-shadow:0 6px 18px rgba(20,33,61,.25);cursor:pointer}
.buscar{display:flex;gap:8px;margin-bottom:12px}
.buscar input,.buscar select{flex:1;padding:10px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff;font-size:15px;min-width:0}
/* calendario */
.semana-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.semana-nav .tit{flex:1;text-align:center;font-weight:700}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dia-chip{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:6px 0;text-align:center;cursor:pointer}
.dia-chip .d{font-size:11px;color:var(--suave);text-transform:uppercase}
.dia-chip .n{font-weight:700;font-size:16px}
.dia-chip .c{font-size:10px;color:var(--azul);height:12px}
.dia-chip.hoy{border-color:var(--amarillo);border-width:2px}
.dia-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dia-chip.on .d,.dia-chip.on .c{color:#cfd6e6}
.dia-tit{font-weight:700;margin:16px 0 6px;color:var(--navy2)}
.dia-tit::first-letter{text-transform:uppercase}
.clase{display:flex;gap:12px;background:#fff;border:1px solid var(--borde);border-left:5px solid var(--azul);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.clase.dada{border-left-color:var(--verde)}.clase.ausente{border-left-color:var(--naranja)}
.clase.cancelada{border-left-color:#aab;opacity:.6}
.clase .hora{font-weight:700;min-width:52px;font-variant-numeric:tabular-nums}
.clase .hora small{display:block;font-weight:400;color:var(--suave);font-size:12px}
.clase .info{flex:1;min-width:0}
.clase .info b{display:block}
.clase .info span{font-size:13px;color:var(--suave)}
/* calendario mensual */
.meses{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none;align-items:center}
.meses::-webkit-scrollbar{display:none}
.mes-chip{flex:none;border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;cursor:pointer;font-size:14px}
.mes-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.anio{flex:none;font-weight:700;color:var(--navy2);padding:0 2px}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden;margin:0 -10px}
.mes-dow{text-align:center;font-size:12px;font-weight:600;color:var(--suave);padding:6px 0;border-bottom:1px solid var(--borde);background:#fafbfc}
.mes-dia{min-height:96px;border-top:1px solid var(--borde);border-left:1px solid var(--borde);padding:3px 2px;cursor:pointer;min-width:0}
.mes-dia:nth-child(7n+8){border-left:0}
.mes-dia.fuera{background:#fafbfc}.mes-dia.fuera .mes-num{color:#b3b9c4}
.mes-num{text-align:center;font-size:13px;margin-bottom:3px}
.mes-num span{display:inline-block;min-width:22px;padding:1px 4px;border-radius:999px}
.mes-dia.hoy .mes-num span{background:var(--azul);color:#fff;font-weight:700}
.ev{display:block;font-size:11px;line-height:1.4;background:#ef7d3c;color:#fff;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-style:normal}
.ev.dada{background:var(--verde)}.ev.ausente{background:#d99a00}.ev.cancelada{background:#c5cad3;text-decoration:line-through}
.mas{font-size:11px;text-align:center;color:var(--suave);font-weight:700}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--suave)}
.leyenda span{display:flex;align-items:center;gap:4px}.leyenda i.ev{width:12px;height:12px;padding:0;margin:0}
@media(min-width:640px){.mes-dia{min-height:118px}.ev{font-size:12px}.mes{margin:0}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}
.login .caja{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:380px}
.login .logo-grande{width:64px;height:64px;border-radius:16px;background:var(--amarillo);color:var(--navy);
  display:grid;place-items:center;font-weight:900;font-size:22px;margin:0 auto 10px}
.login h1{text-align:center;font-size:22px;margin:0 0 4px}
.login p.sub{text-align:center;color:var(--suave);margin:0 0 18px}
.link{background:none;border:0;color:var(--azul);cursor:pointer;padding:0;font-weight:600}
.error{background:#fde8e8;color:#a32b2b;border-radius:10px;padding:10px 12px;font-size:14px}
.ok{background:#e3f5ea;color:#17703d;border-radius:10px;padding:10px 12px;font-size:14px}
/* modal */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(20,33,61,.45)}
dialog .m-cab{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:#fff;z-index:1}
dialog .m-cab b{font-size:17px}
dialog .m-cuerpo{padding:16px}
.x{background:#eef0f4;border:0;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);
  background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;z-index:100;font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cargando{text-align:center;color:var(--suave);padding:40px}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
